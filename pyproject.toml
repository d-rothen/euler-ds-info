[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "euler-ds-info"
version = "0.1.0"
description = "Dataset statistics helpers for Euler-view MOR estimation."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "numpy>=1.26",
  "euler-loading",
  "ds-crawler",
]

[project.scripts]
euler-ds-info = "euler_ds_info.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
